[project]
name = "embed-service"
version = "0.1.0"
description = "Lightweight CPU sentence-embedding microservice (FastAPI + sentence-transformers). GPU is reserved for llama.cpp."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sentence-transformers>=3.0,<5",
]

[tool.uv]
package = false

# Force CPU-only PyTorch wheels so this service never pulls (or needs) a GPU stack.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }